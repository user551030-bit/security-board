name: update

on:
  schedule:
    - cron: "17 * * * *"   # 毎時 17 分（UTC）に更新
    - cron: "47 15 * * *"  # 毎日 0:47（日本時間）に蓄積データの控えをリポジトリへ保存
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
        env:
          # 前回までの蓄積は公開中のページから読む（読めなければ data/history.json の控え）
          HISTORY_URL: https://user551030-bit.github.io/security-board/history.json
      - name: 蓄積データの控えを保存（1 日 1 回）
        if: github.event.schedule == '47 15 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "蓄積データの控えを更新" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
